name: Kodutahvli andmed

on:
  schedule:
    - cron: "7 * * * *"   # iga tund
  workflow_dispatch:       # käsitsi käivitamine Actions lehelt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Elektri hinnad
        run: python scripts/elekter.py
        continue-on-error: true
      - name: Turg
        run: python scripts/turg.py
        continue-on-error: true
      - name: Salvesta muudatus
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Kodutahvli andmed" && git push)
